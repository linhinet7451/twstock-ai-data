name: 每月歷史瘦身（squash）
# 每月 1 號 19:00 UTC（台灣時間 2 號 03:00）把本 repo 的 git 歷史重置成單一
# commit（內容＝當下全部檔案，一字不差），避免每日資料 commit 無限累積膨脹。
# 資料檔案與 Pages 網址完全不變。與每日更新共用 concurrency 群組，不會互搶。
on:
  schedule:
    - cron: "0 19 1 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  squash:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: 重置歷史為單一 commit
        run: |
          git config user.name "twstock-data-bot"
          git config user.email "actions@github.com"
          git checkout --orphan snapshot
          git add -A
          git commit -m "資料快照（每月歷史重置）$(date -u +%F)"
          git branch -D main
          git branch -m main
          git push --force origin main
