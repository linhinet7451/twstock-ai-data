name: 每日行情自動更新
# 台灣時間週一至週五 18:47 執行（UTC 10:47）、20:17 備援：抓最近 14 天增量、重建掃描包、
# commit 回本 repo；本 repo 的 Pages 採 branch 部署，push 後自動重新發布。
on:
  schedule:
    # 主排程 18:47（避開 :30 整點半點高峰，GitHub 排程在高峰常延遲或被丟棄；
    # 2026-11-13 首跑 10:30 UTC 就未觸發）＋同晚 20:17 備援；
    # 每日增量重跑安全：資料無變動時 commit 步驟會自動跳過。
    - cron: "47 10 * * 1-5"
    - cron: "17 12 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: data-update
  cancel-in-progress: false
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 每日增量更新
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python3 backend/update_data.py daily --sleep 0.3
      - name: Commit 資料
        id: commit
        run: |
          git config user.name "twstock-data-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "無資料變動，不 commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: 每日行情自動更新 $(date -u +%F)"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi
